name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    uses: nzbgetcom/build-unpackers/.github/workflows/build.yml@main
    permissions:
      contents: write
      actions: write
    with:
      unpackers: 7zip
      zip7-version: "26.03"
      release-tag: v26.03
